<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dashboard Eleitoral</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e6edf3;
        }
        .login-logo p {
            color: #8b949e;
            font-size: 14px;
            margin-top: 6px;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6e7681;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2ea043, #3fb950);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-msg {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-msg.show {
            display: flex;
        }
        .hint-box {
            margin-top: 20px;
            padding: 12px 14px;
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 8px;
            font-size: 12px;
            color: #58a6ff;
        }
        .hint-box strong {
            display: block;
            margin-bottom: 4px;
        }
        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #6e7681;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <span class="icon">🗳️</span>
            <h1>Dashboard Eleitoral</h1>
            <p>Sistema de Análise Eleitoral — Rondônia</p>
        </div>

        <div class="login-card">
            <div class="error-msg" id="error-msg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text">Usuário ou senha incorretos.</span>
            </div>

            <form id="login-form" onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Usuário</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-input"
                               placeholder="seu.usuario" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input"
                               placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div class="hint-box" id="hint-box">
                <strong>🔑 Acesso inicial</strong>
                Usuário: <strong>admin</strong> — Senha: <strong>admin123</strong>
            </div>
        </div>

        <p class="footer-text">Dados: Tribunal Superior Eleitoral (TSE)</p>
    </div>

    <script>
        // Garantir que exista ao menos um usuário admin padrão
        function seedDefaultUser() {
            const users = JSON.parse(localStorage.getItem('dashboard_users') || '[]');
            if (users.length === 0) {
                users.push({
                    id: 1,
                    username: 'admin',
                    password: 'admin123',
                    name: 'Administrador',
                    role: 'admin',
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('dashboard_users', JSON.stringify(users));
            }
        }

        seedDefaultUser();

        // Se já estiver autenticado, redirecionar
        const session = JSON.parse(localStorage.getItem('dashboard_session') || 'null');
        if (session) {
            window.location.href = 'index.html';
        }

        function doLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            const users = JSON.parse(localStorage.getItem('dashboard_users') || '[]');
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                localStorage.setItem('dashboard_session', JSON.stringify({
                    id: user.id,
                    name: user.name,
                    role: user.role,
                    username: user.username
                }));
                window.location.href = 'index.html';
            } else {
                errorEl.classList.add('show');
                document.getElementById('error-text').textContent = 'Usuário ou senha incorretos.';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }

            return false;
        }

        // Ocultar erro ao digitar
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('error-msg').classList.remove('show');
        });
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('error-msg').classList.remove('show');
        });
    </script>
</body>
</html>
