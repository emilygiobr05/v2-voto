[build]
  command = "pip install -r requirements.txt"

[build.environment]
  PYTHON_VERSION = "3.11"

[[services]]
  internal_port = 8050
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

[env]
  PORT = "8050"
